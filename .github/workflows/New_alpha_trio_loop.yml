# .github/workflows/alpha_trio_infinite.yml (FULL VERSION — Hybrid Schedule)

name: Alpha-Trio Infinite Loop

on:
  schedule:
    # ✅ 매일: flash로 안정 루프 (UTC 00:00 = KST 09:00)
    - cron: '0 0 * * *'
    # ✅ 주 1회(월): pro 우선 시도 (안되면 코드가 flash로 폴백) (UTC 01:00 = KST 10:00)
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  intelligence_loop:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 시스템 초기화
        uses: actions/checkout@v4
        with:
          clean: true

      - name: 2. 파이썬 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 최신 고지능 라이브러리 설치
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests pinecone google-genai lxml

      # ✅ 매일 루프: flash 강제
      - name: 4A. Daily run (flash)
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_MODEL: "models/gemini-1.5-flash"
        run: python alpha_trio_infinite.py

      # ✅ 주 1회: pro 시도 (404면 flash로 생존)
      - name: 4B. Weekly run (try pro)
        if: github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_MODEL: "models/gemini-1.5-pro"
        run: python alpha_trio_infinite.py

      # ✅ 수동 실행: pro 우선(안되면 flash로 생존)
      - name: 4C. Manual run (try pro)
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_MODEL: "models/gemini-1.5-pro"
        run: python alpha_trio_infinite.py
