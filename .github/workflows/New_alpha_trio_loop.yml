name: Alpha-Trio Infinite Loop

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  intelligence_loop:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 시스템 초기화
        uses: actions/checkout@v4
        with:
          clean: true

      - name: 2. 파이썬 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 최신 고지능 라이브러리 설치
        run: |
          pip install --upgrade pip
          # pinecone-client 대신 pinecone을, google-generativeai 대신 google-genai를 설치합니다.
          pip install yfinance pandas numpy requests pinecone google-genai lxml

      - name: 4. Alpha-Trio 인피니티 엔진 가동
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alpha_trio_infinite.py
