name: Alpha-Trio 2.9 Intelligence Loop

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정 가동
  workflow_dispatch: # 수동 가동 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests google-generativeai pinecone

      - name: 4. 자가학습 엔진 가동
        env:
          # GitHub Secrets에 등록한 이름과 아래 왼쪽 이름이 똑같아야 합니다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alpha_trio_v29.py
