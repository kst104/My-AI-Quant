name: Alpha-Trio Infinite Loop

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  intelligence_loop:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: 2. Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install libs
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests pinecone lxml

      # ✅ 여기서 "정말 최신 파일이 체크아웃 되었는지" 확정
      - name: 3.5 Debug — show commit & file head
        run: |
          echo "GIT SHA:"
          git rev-parse HEAD
          echo ""
          echo "WORKFLOW FILE:"
          ls -al .github/workflows || true
          echo ""
          echo "alpha_trio_infinite.py HEAD (first 60 lines):"
          sed -n '1,60p' alpha_trio_infinite.py
          echo ""
          echo "Search for old hardcoded model string:"
          (grep -n "gemini-1.5-pro:generateContent" -n alpha_trio_infinite.py || true)
          (grep -n "gemini-1.5-pro" alpha_trio_infinite.py || true)

      - name: 4. Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alpha_trio_infinite.py
