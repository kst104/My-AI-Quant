name: Alpha-Trio Infinite Loop

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정 가동
  workflow_dispatch:    # 지금 당장 가동 버튼

jobs:
  intelligence_loop:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 시스템 초기화 및 코드 동기화
        uses: actions/checkout@v4
        with:
          clean: true

      - name: 2. 파이썬 3.11 환경 구축
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 고지능 라이브러리 설치
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests google-generativeai pinecone-client lxml

      - name: 4. Alpha-Trio 인피니티 엔진 가동
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alpha_trio_infinite.py # 👈 새 파일 이름
