name: Alpha-Trio-Final-Fix

on:
  workflow_dispatch: # 직접 'Run workflow' 버튼을 누를 수 있게 합니다.

jobs:
  run_engine:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 코드 강제 동기화
        uses: actions/checkout@v4
        with:
          clean: true # 👈 이전의 모든 찌꺼기를 삭제합니다.

      - name: 2. 파이썬 환경 구축
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 정예 라이브러리 설치
        run: pip install yfinance pandas numpy requests google-generativeai pinecone

      - name: 4. 엔진 가동 (새 파일 실행)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alpha_trio_final.py # 👈 파일 이름을 바꿨습니다.
