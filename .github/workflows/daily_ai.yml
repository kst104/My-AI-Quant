name: Daily Market AI Learning

on:
  schedule:
    - cron: '0 0 * * *' # 매일 오전 9시
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 모든 히스토리를 가져와 충돌 방지

      - name: 2. 파이썬 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 라이브러리 설치
        run: pip install yfinance pandas requests

      - name: 4. AI 시스템 가동
        run: |
          python market_scanner.py
          python reasoning_engine.py
          python learning_module.py
          python integrated_signal_bot.py

      - name: 5. 변경된 데이터 저장 (지식 축적)
        run: |
          git config --global user.name "Auto-AI"
          git config --global user.email "ai@autobot.com"
          git add market_history.csv hypothesis_log.txt learning_results.txt
          
          # 변경사항이 있을 때만 실행
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "AI 지식 업데이트: $(date)"
            git pull --rebase origin main # 👈 [rejected] 오류 해결사
            git push
          else
            echo "업데이트할 데이터가 없습니다."
          fi
