name: Daily Market AI Learning

on:
  schedule:
    - cron: '0 0 * * *' # 매일 오전 9시
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 모든 히스토리를 다 가져옴 (중요)

      - name: 2. 파이썬 및 라이브러리 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas requests

      - name: 3. AI 시스템 가동
        run: |
          python market_scanner.py
          python reasoning_engine.py
          python learning_module.py
          python integrated_signal_bot.py

      - name: 4. 강제 동기화 및 지식 저장
        run: |
          git config --global user.name "Auto-AI"
          git config --global user.email "ai@autobot.com"
          
          # 1. 일단 현재 변경사항(CSV 등)을 장바구니에 담음
          git add .
          
          # 2. 변경사항이 진짜 있을 때만 진행
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "AI 지식 업데이트: $(date)"
            
            # 3. [불도저 포인트] 서버의 최신 내용을 가져와서 내 뒤에 붙임
            git pull origin main --rebase
            
            # 4. 최종 업로드
            git push origin main
          else
            echo "업데이트할 데이터가 없습니다."
          fi
