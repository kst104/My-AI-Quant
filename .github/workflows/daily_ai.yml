name: Daily Market AI Learning

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 비서에게 쓰기 권한을 코드상에서 한 번 더 명시
      
    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 모든 히스토리를 가져와서 충돌 원천 차단

      - name: 2. 파이썬 및 라이브러리 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas requests

      - name: 3. AI 시스템 가동
        run: |
          python market_scanner.py
          python reasoning_engine.py
          python learning_module.py
          python integrated_signal_bot.py

      - name: 4. 지식 축적 (오류 방지 로직 강화)
        run: |
          git config --global user.name "Auto-AI"
          git config --global user.email "ai@autobot.com"
          
          # 변경 사항이 있는지 확인 후 있으면 진행
          git add market_history.csv hypothesis_log.txt learning_results.txt
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "AI 지식 업데이트: $(date)"
            # [핵심] 서버에 있는 최신 내용을 먼저 가져오고 내 걸 합친 다음 올림
            git pull --rebase origin main
            git push origin main
          else
            echo "변경사항이 없어 저장 단계를 건너뜁니다."
          fi
