name: Alpha-Trio 2.1 Daily Operation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 인프라 라이브러리 설치
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests google-generativeai pinecone-client pandas-ta

      - name: 4. Alpha-Trio 2.1 가동
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python integrated_signal_bot.py
