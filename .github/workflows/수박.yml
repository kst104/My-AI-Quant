name: Alpha-Trio 2.5 Daily Operation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 설정 (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리만 설치
        run: |
          pip install --upgrade pip
          # 에러 유발자 pandas-ta를 빼고, 최신 pinecone을 설치합니다.
          pip install yfinance pandas numpy requests google-generativeai pinecone

      - name: 4. Alpha-Trio 2.5 가동
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python integrated_signal_bot.py
